name: verify

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The unit floor probes a REAL tmux on a private socket (tests/coexistence.test.ts):
      # a runner is exactly the fresh box a new user has, so it must carry the binary.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: npm run verify
      # This runner normally has no user customization. The check still proves that the
      # contribution does not break the clean-box path; contributor and promotion evidence
      # must say when customized stores were actually exercised.
      - run: npm run byoin
